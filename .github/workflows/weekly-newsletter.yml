name: Weekly Strongsville Newsletter

on:
  # Scheduled trigger temporarily disabled - GitHub's cron has been unreliably
  # delayed by hours two weeks running. Re-enable (uncomment below) once a
  # more dependable trigger is set up, or once this is otherwise resolved.
  # schedule:
  #   - cron: "7 12 * * 5"
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Optional: send ONLY to this email instead of the full subscriber list (leave blank for a normal run)'
        required: false
        type: string

permissions:
  contents: write   # needed so the workflow can commit the archived issue page back to the repo

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and send newsletter
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_SECRET: ${{ secrets.APPS_SCRIPT_SECRET }}
          TEST_EMAIL: ${{ github.event.inputs.test_email }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: python -u newsletter_generator.py

      - name: Commit archived issue to repo (skipped on test runs)
        if: ${{ github.event.inputs.test_email == '' }}
        run: |
          git config user.name "Trailhead Bot"
          git config user.email "actions@github.com"
          git add issues/ || true
          git diff --staged --quiet || git commit -m "Archive issue $(date +%Y-%m-%d)"
          git push || true

      - name: Upload issue as artifact (for review)
        uses: actions/upload-artifact@v4
        with:
          name: latest-issue
          path: latest_issue.html
